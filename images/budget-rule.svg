<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 330" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">The 50/30/20 budget rule</title>
  <desc id="d">Donut chart: 50 percent needs, 30 percent wants, 20 percent savings.</desc>
  <rect width="320" height="330" rx="16" fill="#f4f4e2"/>
  <g transform="rotate(-90 160 130)" fill="none" stroke-width="38">
    <circle cx="160" cy="130" r="80" stroke="#234c3c" stroke-dasharray="251.33 251.33" stroke-dashoffset="0"/>
    <circle cx="160" cy="130" r="80" stroke="#e5c138" stroke-dasharray="150.8 351.86" stroke-dashoffset="-251.33"/>
    <circle cx="160" cy="130" r="80" stroke="#7a4f2a" stroke-dasharray="100.53 402.12" stroke-dashoffset="-402.13"/>
  </g>
  <text x="160" y="138" text-anchor="middle" font-family="Nunito, Segoe UI, Tahoma, sans-serif" font-size="19" font-weight="700" fill="#17241f">50/30/20</text>
  <g font-family="Nunito, Segoe UI, Tahoma, sans-serif" font-size="17" fill="#17241f">
    <rect x="72" y="241" width="16" height="16" rx="3" fill="#234c3c"/><text x="98" y="254">Needs: 50%</text>
    <rect x="72" y="266" width="16" height="16" rx="3" fill="#e5c138"/><text x="98" y="279">Wants: 30%</text>
    <rect x="72" y="291" width="16" height="16" rx="3" fill="#7a4f2a"/><text x="98" y="304">Savings: 20%</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
